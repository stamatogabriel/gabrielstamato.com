version: '3.8'

services:
  wordpress:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST:     db
      WORDPRESS_DB_NAME:     wordpress
      WORDPRESS_DB_USER:     wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DEBUG:       "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', true );
        @ini_set( 'display_errors', 0 );
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Themes — edit locally, changes appear immediately in the container
      - ./themes:/var/www/html/wp-content/themes
      # Plugins and uploads also persisted on the host for FileZilla transfers
      - ./plugins:/var/www/html/wp-content/plugins
      - ./uploads:/var/www/html/wp-content/uploads
    networks:
      - wordpress

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE:      wordpress
      MYSQL_USER:          wp
      MYSQL_PASSWORD:      wp
    ports:
      - "3306:3306"
    volumes:
      - .docker/db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwp", "-pwp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wordpress

networks:
  wordpress:
    driver: bridge